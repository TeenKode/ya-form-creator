name: Build Windows EXE & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -v -p "test*.py"
      - name: Ensure no bundled surveys or credentials
        shell: bash
        run: |
          test ! -e form_config.json
          test ! -e example_all_types.json
          test ! -e .yandex_form_credentials.json
          test ! -e user_settings.json

  windows-exe:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests on Windows
        run: python -m unittest discover -v -p "test*.py"
      - name: Build one-file EXE
        run: pyinstaller --noconfirm --clean yaformcreator.spec
      - name: Verify single EXE output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'YaFormCreator.exe') {
            throw 'Expected only dist/YaFormCreator.exe'
          }
          if ($files[0].Length -lt 1000000) { throw 'EXE is unexpectedly small' }
          Get-FileHash dist/YaFormCreator.exe -Algorithm SHA256
      - name: Upload downloadable EXE
        uses: actions/upload-artifact@v4
        with:
          name: YaFormCreator-Windows-x64
          path: dist/YaFormCreator.exe
          if-no-files-found: error
      - name: Publish new VERSION from main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid VERSION: $version" }
          $releases = gh release list --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot query GitHub Releases" }
          if (@($releases | Where-Object { $_.tagName -eq $version }).Count -gt 0) {
            Write-Host "Release $version already published"
            exit 0
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$version"
          if ($LASTEXITCODE -ne 0) { throw "Cannot query tags" }
          if (-not $remoteTag) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $version -m "YaFormCreator $version"
            if ($LASTEXITCODE -ne 0) { throw "Tag creation failed" }
            git push origin "refs/tags/$version"
            if ($LASTEXITCODE -ne 0) { throw "Tag push failed" }
          }
          gh release create $version dist/YaFormCreator.exe --title "YaFormCreator $version" --notes-file RELEASE_NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create "$env:TAG" dist/YaFormCreator.exe --title "$env:TAG" --generate-notes --verify-tag