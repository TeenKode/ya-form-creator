name: Browser app and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, opera]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python scripts/build_browser.py
      - run: node scripts/build_opera.mjs
      - run: npm test
      # ubuntu-latest already includes the system libraries used by its Chrome.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: python scripts/prepare_opera_ci.py
        if: matrix.browser == 'opera'
        timeout-minutes: 5
      - run: npm run test:browser
        timeout-minutes: 5
      - run: node scripts/build_opera.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser == 'opera' && 'Opera-QA' || 'Browser-QA' }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: Opera-submission
          path: browser-build/opera-submission/
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: YaFormCreator-extension
          path: web-dist/yaform-extension.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && matrix.browser == 'chromium'
        with:
          path: web-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
