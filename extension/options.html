<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение · YaFormCreator</title><link rel="stylesheet" href="ui.css"></head><body><main class="shell">
<header><img src="icons/icon128.png" alt="" width="48" height="48"><div><h1>Подключение к Яндексу</h1></div></header>
<form id="settings">
<section class="card"><h2>1. Войдите в свой аккаунт</h2><label>Где работает ваша организация?<select id="org_header"><option value="X-Org-Id">Яндекс 360 для бизнеса</option><option value="X-Cloud-Org-Id">Yandex Cloud / Identity Hub</option></select></label>
<button type="button" id="oauth" class="primary">Войти через Яндекс ↗</button>
<label class="check"><input type="checkbox" id="remember"> Запомнить вход на этом компьютере</label>
<details><summary>Настройки OAuth-приложения</summary><label>ClientID приложения<input id="clientId" autocomplete="off"></label><label>Redirect URI<input id="redirect" readonly></label><p class="muted">Обычно менять эти настройки не нужно.</p></details></section>
<section class="card"><h2>2. Выберите организацию</h2><button type="button" id="findOrgs">Найти мои организации</button><label id="orgSelectLabel" hidden>Организация<select id="orgSelect"><option value="">Выберите из списка</option></select></label><p id="organizationName" class="muted" hidden></p>
<details id="manualOrg"><summary>Указать ID вручную</summary><label>ID организации<input id="org_id" autocomplete="off"></label><button type="submit">Сохранить организацию</button><p class="muted"><a href="https://teenkode.github.io/ya-form-creator/help.html#organization" target="_blank" rel="noreferrer">Где найти ID?</a></p></details></section>
<details class="card" id="manualToken"><summary>Или вставить готовый токен</summary><label>Тип токена<select id="auth_scheme"><option value="OAuth">OAuth — Яндекс ID</option><option value="Bearer">IAM — Yandex Cloud</option></select></label><label>Токен<input id="token" type="password" autocomplete="off" placeholder="Вставьте без слова OAuth или Bearer"></label><label class="check"><input type="checkbox" id="reveal"> Показать введённый токен</label><button class="primary" type="submit">Сохранить подключение</button></details></form>
<div class="actions"><button id="access">Проверить доступ</button><button id="forget" class="danger">Выйти</button><a href="https://teenkode.github.io/ya-form-creator/help.html#token" target="_blank" rel="noreferrer">Помощь с подключением</a></div><p id="status" role="status" aria-live="polite"></p></main><script src="options.mjs" type="module"></script></body></html>
